<!doctype html>
<html lang="de">
<head><meta charset="utf-8"><title>Kartenkarte</title>
<style>html,body{margin:0}</style></head>
<body>
<div class="ds-stage">
<div class="ds-cell"><button class="map-card plq"><span class="map-thumb" style="background:linear-gradient(135deg,var(--map-meadow-1),var(--map-meadow-2) 55%,var(--map-meadow-3))"></span><span class="map-name">Wiese</span><span class="map-stars"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.2 L14.9 8.6 L21.8 9.3 L16.6 14 L18.1 20.9 L12 17.3 L5.9 20.9 L7.4 14 L2.2 9.3 L9.1 8.6 Z" fill="#f2c14e" stroke="#2b1a10" stroke-width="2" stroke-linejoin="round"/></svg><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.2 L14.9 8.6 L21.8 9.3 L16.6 14 L18.1 20.9 L12 17.3 L5.9 20.9 L7.4 14 L2.2 9.3 L9.1 8.6 Z" fill="#f2c14e" stroke="#2b1a10" stroke-width="2" stroke-linejoin="round"/></svg><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.2 L14.9 8.6 L21.8 9.3 L16.6 14 L18.1 20.9 L12 17.3 L5.9 20.9 L7.4 14 L2.2 9.3 L9.1 8.6 Z" fill="#f2c14e" stroke="#2b1a10" stroke-width="2" stroke-linejoin="round"/></svg></span><span class="map-best">Beste Welle 20</span></button><small>gespielt, 3 Sterne</small></div>
<div class="ds-cell"><button class="map-card plq current"><span class="map-thumb" style="background:linear-gradient(135deg,var(--map-ice-1),var(--map-ice-2) 55%,var(--map-ice-3))"></span><span class="map-name">Eiswelt</span><span class="map-stars"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.2 L14.9 8.6 L21.8 9.3 L16.6 14 L18.1 20.9 L12 17.3 L5.9 20.9 L7.4 14 L2.2 9.3 L9.1 8.6 Z" fill="#f2c14e" stroke="#2b1a10" stroke-width="2" stroke-linejoin="round"/></svg><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.2 L14.9 8.6 L21.8 9.3 L16.6 14 L18.1 20.9 L12 17.3 L5.9 20.9 L7.4 14 L2.2 9.3 L9.1 8.6 Z" fill="#5a3a22" stroke="#2b1a10" stroke-width="2" stroke-linejoin="round"/></svg><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.2 L14.9 8.6 L21.8 9.3 L16.6 14 L18.1 20.9 L12 17.3 L5.9 20.9 L7.4 14 L2.2 9.3 L9.1 8.6 Z" fill="#5a3a22" stroke="#2b1a10" stroke-width="2" stroke-linejoin="round"/></svg></span><span class="map-best">Beste Welle 14</span></button><small>gewählt (Fokus): 6 px hoch, Ring hl</small></div>
<div class="ds-cell"><button class="map-card plq" disabled><span class="map-thumb" style="background:linear-gradient(135deg,var(--map-fork-1),var(--map-fork-2) 55%,var(--map-fork-3))"></span><svg class="map-lock" width="44" height="44" viewBox="0 0 44 44" aria-hidden="true"><path d="M13 20 V14 a9 9 0 0 1 18 0 V20" fill="none" stroke="#2b1a10" stroke-width="7"/><path d="M13 20 V14 a9 9 0 0 1 18 0 V20" fill="none" stroke="#d9dde2" stroke-width="3"/><rect x="8" y="20" width="28" height="20" rx="4" fill="#f2c14e" stroke="#2b1a10" stroke-width="3"/><circle cx="22" cy="29" r="3" fill="#2b1a10"/></svg><span class="map-name">Zangenangriff</span><span class="map-stars"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.2 L14.9 8.6 L21.8 9.3 L16.6 14 L18.1 20.9 L12 17.3 L5.9 20.9 L7.4 14 L2.2 9.3 L9.1 8.6 Z" fill="#5a3a22" stroke="#2b1a10" stroke-width="2" stroke-linejoin="round"/></svg><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.2 L14.9 8.6 L21.8 9.3 L16.6 14 L18.1 20.9 L12 17.3 L5.9 20.9 L7.4 14 L2.2 9.3 L9.1 8.6 Z" fill="#5a3a22" stroke="#2b1a10" stroke-width="2" stroke-linejoin="round"/></svg><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.2 L14.9 8.6 L21.8 9.3 L16.6 14 L18.1 20.9 L12 17.3 L5.9 20.9 L7.4 14 L2.2 9.3 L9.1 8.6 Z" fill="#5a3a22" stroke="#2b1a10" stroke-width="2" stroke-linejoin="round"/></svg></span><span class="map-best">Gewinne erst Eiswelt</span></button><small>gesperrt: Schloss, Bild grau</small></div>
</div>
</body>
</html>
