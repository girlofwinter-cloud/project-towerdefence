name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit-Tests
        run: npm test
      - name: Balancing-Simulationen
        run: npm run test:balance
      - name: Browser-Tests
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          npm run test:e2e
